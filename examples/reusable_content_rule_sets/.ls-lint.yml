rule-groups:
  js-defaults:
    - camelCase
    - PascalCase
    - content:max-lines:400
  js-large:
    - camelCase
    - PascalCase
    - content:max-lines:800
  js-names:
    - camelCase
    - PascalCase

ls:
  # Shared defaults for application code.
  .js: group:js-defaults
  .jsx: group:js-defaults
  .ts: group:js-defaults
  .tsx: group:js-defaults

  # Override only the content rule by keeping the naming rules and raising the
  # max-lines limit in a more specific path.
  generated:
    .js: group:js-large
    .jsx: group:js-large
    .ts: group:js-large
    .tsx: group:js-large

  # Drop the max-lines check in vendor code while keeping the naming policy.
  vendor:
    .js: group:js-names
    .jsx: group:js-names
    .ts: group:js-names
    .tsx: group:js-names

ignore:
  # If you need to disable ls-lint entirely for a path, ignore it explicitly.
  - node_modules
  - dist
