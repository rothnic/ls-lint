rule-groups:
  jsTsDefault:
    - camelCase
    - PascalCase
    - content:max-lines:400
  jsTsLargeFiles:
    - camelCase
    - PascalCase
    - content:max-lines:800
  jsTsNamingOnly:
    - camelCase
    - PascalCase

ls:
  # Shared defaults for application code.
  .js: group:jsTsDefault
  .jsx: group:jsTsDefault
  .ts: group:jsTsDefault
  .tsx: group:jsTsDefault

  # A more specific path overrides the parent scope for matching files.
  scripts:
    .js: group:jsTsLargeFiles
    .ts: group:jsTsLargeFiles

  # Drop the max-lines check in vendor code while keeping the naming policy.
  vendor:
    .js: group:jsTsNamingOnly
    .jsx: group:jsTsNamingOnly
    .ts: group:jsTsNamingOnly
    .tsx: group:jsTsNamingOnly

ignore:
  # If you need to disable ls-lint entirely for a path, ignore it explicitly.
  - node_modules
  - dist
