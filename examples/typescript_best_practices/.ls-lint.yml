# TypeScript Best Practices
#
# A practical baseline for any TypeScript project: single-package app,
# library, or API server. Covers 90% of real-world TypeScript use cases.
#
# Features used:
#   - groups:           reusable rule sets (available in this fork)
#   - @<name>:          compact group reference shorthand
#   - content:*:        file-level structural guardrails
#   - => "message":     per-rule remediation guidance
#   - contexts:         stage-aware enforcement (pre-commit warn, pre-push fail)
#
# To use with lefthook, see examples/lefthook_integration/lefthook.yml

# ---------------------------------------------------------------------------
# Reusable rule groups
# ---------------------------------------------------------------------------

groups:
  # ---------------------------------------------------------------------------
  # Naming groups (used individually for directories that enforce one convention)
  # ---------------------------------------------------------------------------

  # camelCase: services, utilities, hooks, and general source modules.
  ts-camel: "camelCase => Default for services, utilities, and hooks. If this file's primary export is a class, component, or named type, rename it in PascalCase and move it to the appropriate directory."

  # PascalCase: components, classes, and named types.
  ts-pascal: "PascalCase => For files whose primary export is a component, class, or shared named type. If this is a utility or service, rename it in camelCase and move it to the appropriate directory."

  # Combined: directories that accept either convention (most common).
  # No per-rule messages here — the rule names are self-documenting, and specific
  # directories use ts-camel or ts-pascal above to give targeted guidance.
  ts-names: "camelCase | PascalCase"

  # ---------------------------------------------------------------------------
  # Size groups (composable — combine with naming via @group | @group in ls: values)
  # ---------------------------------------------------------------------------

  # Standard application code: 400 lines.
  size-standard:
    - "content:max-lines:400 => File exceeds 400 lines. Run scripts/analyze-ts-structure.sh on this file to get a list of its exports, classes, and functions, then split it into focused modules of under 400 lines each. See AGENTS.md for the split approach and examples. Override requires explicit repository owner approval — do not modify .ls-lint.yml without that approval."

  # Test files: 600 lines before splitting is required.
  size-large:
    - "content:max-lines:600 => File exceeds 600 lines. Split into focused test modules, one per concern or component under test. Run scripts/analyze-ts-structure.sh to identify test suite boundaries. Override requires explicit repository owner approval."

  # Generated output: capped at 2000 lines but not expected to be manually reviewed.
  size-relaxed:
    - "content:max-lines:2000 => Generated file exceeds 2000 lines. Investigate the generator configuration or split the output. Override requires explicit repository owner approval."

  # ---------------------------------------------------------------------------
  # Composite groups: naming + size, used as defaults for most source paths
  # ---------------------------------------------------------------------------

  # Standard application source: camelCase | PascalCase + 400-line cap.
  ts-defaults:
    - "@ts-names"
    - "@size-standard"

  # Test files: naming conventions + 600-line cap.
  ts-tests:
    - "@ts-names"
    - "@size-large"

  # Generated output: naming + 2000-line cap.
  ts-generated:
    - "@ts-names"
    - "@size-relaxed"

  # ---------------------------------------------------------------------------
  # Documentation groups
  # ---------------------------------------------------------------------------

  # Standard documentation page.
  #
  # Naming: kebab-case is required for page files. AGENTS.md, README.md, and
  # CHANGELOG.md are exempt via the regex alternative.
  #
  # Content limits: 500 lines is the working limit. Docs written by agents
  # reliably become harder to maintain above this length. When a page exceeds
  # the limit, convert it into a directory with focused section files (see
  # AGENTS.md for the recommended folder structure). For template files or
  # exhaustive reference tables that cannot be split, place them in
  # docs/templates/ where a 2000-line limit applies and front matter is not
  # required.
  #
  # Front matter is required because it powers navigation index generation,
  # link previews, and reliable context loading when an agent searches docs.
  doc-page:
    - "kebab-case"
    - "regex:^(README|AGENTS|CHANGELOG)$"
    - "content:max-lines:500 => Documentation page exceeds 500 lines. Convert it into a directory with focused section files (see AGENTS.md for the split pattern). If this is a template or exhaustive reference that cannot be split, move it to docs/templates/ where a 2000-line limit applies."
    - "content:front-matter:required => Missing YAML front matter. Add at minimum: title (short page title used in navigation) and description (one-sentence summary used in link previews and agent context loading). See AGENTS.md for the full front-matter schema and description-writing guidance."

  # Relaxed docs: templates, exhaustive reference tables, generated docs.
  doc-templates:
    - "kebab-case"
    - "regex:^(README|AGENTS|CHANGELOG)$"
    - "content:max-lines:2000 => Template or reference file exceeds 2000 lines. Consider whether sections can be extracted. Override requires explicit repository owner approval."

# ---------------------------------------------------------------------------
# File and directory naming rules
# ---------------------------------------------------------------------------

ls:
  # All directories use kebab-case.
  .dir: kebab-case

  # Source files: TypeScript and JavaScript — either convention allowed.
  # Specific subdirectories below enforce a single convention where appropriate.
  .ts: "@ts-defaults"
  .tsx: "@ts-defaults"
  .js: camelCase | PascalCase
  .jsx: camelCase | PascalCase

  # Test files: colocated next to source files (Vitest / Jest best practice).
  # The ts-tests group allows a slightly relaxed size limit for test suites.
  # If your project uses a centralised __tests__/ directory instead, remove these
  # root-level entries and add them only under src/__tests__.
  .test.ts: "@ts-tests"
  .test.tsx: "@ts-tests"
  .spec.ts: "@ts-tests"
  .spec.tsx: "@ts-tests"

  # Declaration files follow the same naming as the source file they augment.
  .d.ts: camelCase | PascalCase

  # Style files: kebab-case is the community standard for CSS/SCSS modules.
  .css: kebab-case
  .scss: kebab-case
  .module.css: kebab-case
  .module.scss: kebab-case

  # Configuration files: allow known tool-specific basenames or kebab-case.
  .json: kebab-case | camelCase | regex:^(package|tsconfig|jest\.config|vite\.config|eslint\.config)$
  .yaml: kebab-case
  .yml: kebab-case

  # Root-level markdown: naming check only. Content rules (max-lines, front-matter)
  # apply only inside docs/ where structure is explicitly enforced.
  .md: "kebab-case | regex:^(README|AGENTS|CHANGELOG)$"

  # Root-level coordination docs: require exactly one of each.
  README.md: "exists:1 => Add a root README.md describing the project purpose, quick-start instructions, and links to key documentation."
  AGENTS.md: "exists:1 => Add AGENTS.md with guidance for AI agents operating in this repository. See AGENTS.md in examples/typescript_best_practices/ for a template."

  # src/ is intentionally NOT defined here so root rules apply to files
  # directly inside src/ via ls-lint path fallback. Only subdirectories that
  # need a DIFFERENT convention from root defaults appear below.

  # Components: always PascalCase; compose naming + size via @group | @group.
  src/components:
    .dir: kebab-case | PascalCase
    .tsx: "@ts-pascal | @size-standard"
    .ts: "@ts-pascal | @size-standard"

  # Hooks: always camelCase (React convention: names begin with "use").
  src/hooks:
    .ts: "@ts-camel | @size-standard"
    .tsx: "@ts-camel | @size-standard"

  # Utilities: always camelCase.
  src/utils:
    .ts: "@ts-camel | @size-standard"
    .tsx: "@ts-camel | @size-standard"

  # Types: PascalCase for named types and interfaces.
  src/types:
    .ts: "@ts-pascal | @size-standard"

  # API / service layer: always camelCase.
  src/api:
    .ts: "@ts-camel | @size-standard"
    .tsx: "@ts-camel | @size-standard"

  # Generated output: larger files accepted; enforced by ts-generated group.
  src/generated:
    .ts: "@ts-generated"
    .js: "@ts-generated"

  # Documentation directory: enforce full doc-page rules (naming + content).
  # This is intentionally different from the root .md rule above, which is naming-only.
  # AGENTS.md and README.md are allowed in any docs subdirectory and are exempt
  # from front-matter and max-lines checks via the regex rule inside @doc-page.
  docs:
    .md: "@doc-page"

  # Templates and exhaustive reference docs: relaxed size, no front-matter required.
  docs/templates:
    .md: "@doc-templates"

# ---------------------------------------------------------------------------
# Context directives
#
# These define stage-specific enforcement behavior. Select with --context.
# Use with lefthook: see examples/lefthook_integration/lefthook.yml
# ---------------------------------------------------------------------------

contexts:
  pre-commit:
    mode: warn
    hook: pre-commit
    environment: local
    message: >
      Commit is not blocked. These are early warnings about naming conventions
      and file size. Queue any quick cleanup before pushing. Run
      scripts/analyze-ts-structure.sh on oversized files to identify split points.

  pre-push:
    mode: fail
    hook: pre-push
    environment: local
    override: repository owner approval
    references:
      - AGENTS.md
      - docs/contributing.md
    message: >
      Push is blocked until these naming and structure requirements are
      resolved. See AGENTS.md for the override process and split guidelines.
      Agents must not modify .ls-lint.yml or bypass lint configuration without
      explicit repository owner approval.

# ---------------------------------------------------------------------------
# Ignore patterns
#
# ls-lint does not read .gitignore automatically. Be precise: only ignore
# files that genuinely should not be linted. In particular, do NOT ignore
# .env.example or .env.sample — those files should be committed and linted.
# Only ignore environment override files that must never be committed.
# ---------------------------------------------------------------------------

ignore:
  - node_modules
  - dist
  - build
  - coverage
  - .next
  - out
  - .turbo
  - .env.local
  - .env.*.local
  - "**/.env.local"
  - "**/.env.*.local"
  - "**/*.min.js"
